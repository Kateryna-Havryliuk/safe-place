<!DOCTYPE html>
<html>
<head>
    <title>Тест камери</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        video {
            width: 100%;
            max-width: 640px;
            border: 3px solid #3498db;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            padding: 12px 25px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        button:hover {
            background: #2980b9;
        }
        #status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-size: 16px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #e7f3ff; color: #004085; }
    </style>
</head>
<body>
    <h1>📹 Тест доступу до камери</h1>
    
    <div id="status" class="info">
        <i class="fas fa-info-circle"></i> Натисніть кнопку для тесту
    </div>
    
    <video id="testVideo" autoplay playsinline muted></video>
    
    <button onclick="testCamera()">
        <i class="fas fa-camera"></i> Тестувати камеру
    </button>
    
    <button onclick="checkPermissions()">
        <i class="fas fa-shield-alt"></i> Перевірити дозволи
    </button>
    
    <script>
        async function testCamera() {
            const status = document.getElementById('status');
            const video = document.getElementById('testVideo');
            
            status.className = 'info';
            status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Запит доступу до камери...';
            
            try {
                // Таймаут 10 секунд
                const timeoutPromise = new Promise((_, reject) => {
                    setTimeout(() => reject(new Error('Timeout')), 10000);
                });
                
                const stream = await Promise.race([
                    navigator.mediaDevices.getUserMedia({ video: true }),
                    timeoutPromise
                ]);
                
                video.srcObject = stream;
                
                status.className = 'success';
                status.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Камера працює! Доступ отримано.';
                
                console.log('✅ Успіх!');
                
            } catch (error) {
                console.error('❌ Помилка:', error);
                
                status.className = 'error';
                
                if (error.message === 'Timeout') {
                    status.innerHTML = '<i class="fas fa-hourglass-end"></i> ⏰ Таймаут! Камера не відповідає.';
                } else if (error.name === 'NotAllowedError') {
                    status.innerHTML = '<i class="fas fa-ban"></i> 🚫 Доступ заборонено! Дозвольте камеру в налаштуваннях.';
                } else if (error.name === 'NotFoundError') {
                    status.innerHTML = '<i class="fas fa-video-slash"></i> 🔍 Камеру не знайдено!';
                } else {
                    status.innerHTML = '<i class="fas fa-exclamation-triangle"></i> ❌ ' + error.message;
                }
            }
        }
        
        async function checkPermissions() {
            const status = document.getElementById('status');
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const cameras = devices.filter(d => d.kind === 'videoinput');
                
                let html = '<i class="fas fa-info-circle"></i> ';
                html += `Знайдено камер: ${cameras.length}<br>`;
                
                cameras.forEach((camera, i) => {
                    html += `Камера ${i+1}: ${camera.label || 'Без назви'}<br>`;
                });
                
                if (cameras.length === 0) {
                    html += '<br>⚠️ Камери не знайдено! Підключіть камеру.';
                }
                
                status.className = 'info';
                status.innerHTML = html;
                
            } catch (error) {
                status.className = 'error';
                status.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Помилка: ' + error.message;
            }
        }
    </script>
    
    <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
</body>
</html>
