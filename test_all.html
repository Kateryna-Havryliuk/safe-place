<!DOCTYPE html>
<html>
<head>
    <title>Тест всіх функцій</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        button { margin: 10px; padding: 10px 20px; cursor: pointer; }
        pre { background: #f0f0f0; padding: 10px; overflow: auto; max-height: 300px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Тест SafePlace API</h1>
    
    <div>
        <h3>Статус авторизації:</h3>
        <pre id="authStatus">Перевіряю...</pre>
    </div>
    
    <div>
        <button onclick="testChats()">1. Тест /api/chats</button>
        <button onclick="testAnalytics()">2. Тест /api/analytics/user</button>
        <button onclick="testTalk()">3. Тест /api/talk (текст)</button>
        <button onclick="testVideo()">4. Тест відео (потрібна камера)</button>
        <button onclick="testVoice()">5. Тест голосу (потрібен мікрофон)</button>
    </div>
    
    <div>
        <h3>Результат:</h3>
        <pre id="result">Натисніть кнопку для тесту...</pre>
    </div>
    
    <script>
        const token = localStorage.getItem('authToken');
        const resultDiv = document.getElementById('result');
        const authStatus = document.getElementById('authStatus');
        
        // Перевірка авторизації
        if (token) {
            authStatus.innerHTML = `✅ Токен знайдено: ${token.substring(0, 30)}...\nКористувач: ${localStorage.getItem('currentUser') || 'невідомо'}`;
        } else {
            authStatus.innerHTML = `❌ Токен ВІДСУТНІЙ! Увійдіть в акаунт на головній сторінці.`;
        }
        
        async function apiCall(url, options = {}) {
            const defaultOptions = {
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token ? `Bearer ${token}` : ''
                }
            };
            const response = await fetch(url, { ...defaultOptions, ...options });
            const data = await response.json();
            return { status: response.status, data };
        }
        
        async function testChats() {
            resultDiv.innerHTML = '⏳ Завантаження...';
            const { status, data } = await apiCall('/api/chats');
            resultDiv.innerHTML = `Статус: ${status}\n\n` + JSON.stringify(data, null, 2);
        }
        
        async function testAnalytics() {
            resultDiv.innerHTML = '⏳ Завантаження...';
            const { status, data } = await apiCall('/api/analytics/user');
            resultDiv.innerHTML = `Статус: ${status}\n\n` + JSON.stringify(data, null, 2);
        }
        
        async function testTalk() {
            resultDiv.innerHTML = '⏳ Відправка...';
            const { status, data } = await apiCall('/api/talk', {
                method: 'POST',
                body: JSON.stringify({ message: "Привіт, це тест" })
            });
            resultDiv.innerHTML = `Статус: ${status}\n\n` + JSON.stringify(data, null, 2);
        }
        
        async function testVideo() {
            resultDiv.innerHTML = '⏳ Запит доступу до камери...';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                resultDiv.innerHTML = '✅ Камера працює! Надсилаю тестовий кадр...';
                
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 240;
                canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
                
                const frameData = canvas.toDataURL('image/jpeg');
                
                const response = await fetch('/api/analyze-multimodal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify({ video: frameData })
                });
                
                const data = await response.json();
                resultDiv.innerHTML = `Статус: ${response.status}\n\n` + JSON.stringify(data, null, 2);
                
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                resultDiv.innerHTML = `❌ Помилка: ${error.message}`;
            }
        }
        
        async function testVoice() {
            resultDiv.innerHTML = '⏳ Запит доступу до мікрофона...';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                resultDiv.innerHTML = '✅ Мікрофон працює! Запис 3 секунди...';
                
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append('audio', blob, 'test.webm');
                    
                    resultDiv.innerHTML = '⏳ Відправка на сервер...';
                    
                    const response = await fetch('/api/analyze-voice', {
                        method: 'POST',
                        headers: { 'Authorization': token ? `Bearer ${token}` : '' },
                        body: formData
                    });
                    
                    const data = await response.json();
                    resultDiv.innerHTML = `Статус: ${response.status}\n\n` + JSON.stringify(data, null, 2);
                };
                
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 3000);
                
            } catch (error) {
                resultDiv.innerHTML = `❌ Помилка: ${error.message}`;
            }
        }
    </script>
</body>
</html>
